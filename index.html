<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flexi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Track meat and animal products in seconds. A chicken coach, honest numbers, no account.">
<meta name="theme-color" content="#eef3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1634" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flexi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one-column phone app — top bar, scrolling content, bottom tab bar; content column max 520px.
   Visual idea: flat Kurzgesagt-style scenes. One "pressure" value (--p, 0..1) from the last 7 days
   moves the whole UI from soft, round and calm to sharp, hard-shadowed and warm. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --rim { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root{
  --bg:#eef3fa; --sky:#dbe8f7; --surface:#ffffff; --surface-2:#e7eef8; --ink:#17214a; --ink-2:#56618c; --line:#cfd8ea;
  --calm:#22a173; --alarm:#e04b33; --sun:#ffb938; --violet:#6553d9;
  --hill:#8fd47a; --hill-2:#6fbf60; --stone:#a7a191;
  --hen:#fffaf0; --hen-shade:#efd9bb; --comb:#e8483b; --beak:#ffae25; --hen-eye:#1b1f33;
  --scrim:#0b1020;
  --f1:#ff7aa8; --f2:#ffd23f; --f3:#8f80ff; --f4:#ffffff;
  --c-beef:#b8442f; --c-pork:#f08ca3; --c-poultry:#f2b53a; --c-processed:#d9607a; --c-lamb:#a07ad6; --c-fish:#3fa3e0;
  --c-egg:#f5c84c; --c-milk:#b9c6dc; --c-cheese:#e8b92e; --c-honey:#d98c1c;
  --font-display:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --p:0;
  --accent: color-mix(in oklab, var(--calm), var(--alarm) calc(var(--p) * 100%));
  --ground: color-mix(in oklab, var(--bg), var(--alarm) calc(var(--p) * 7%));
  --r: calc(26px - 23px * var(--p));
  --r-s: calc(16px - 14px * var(--p));
  --shadow: 0 8px 26px color-mix(in srgb, var(--ink) calc((1 - var(--p)) * 9%), transparent),
            calc(5px * var(--p)) calc(5px * var(--p)) 0 color-mix(in srgb, var(--ink) calc(var(--p) * 85%), transparent);
  --border-w: calc(1px + 1.5px * var(--p));
  transition: --p 1.4s ease;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1634; --sky:#18245a; --surface:#1a2452; --surface-2:#232f64; --ink:#eef1ff; --ink-2:#a8b1dc; --line:#323e78;
    --calm:#45d39a; --alarm:#ff6b54; --sun:#ffd27a; --violet:#9a8dff;
    --hill:#3f9d52; --hill-2:#2f8243; --stone:#6f6a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1634; --sky:#18245a; --surface:#1a2452; --surface-2:#232f64; --ink:#eef1ff; --ink-2:#a8b1dc; --line:#323e78;
  --calm:#45d39a; --alarm:#ff6b54; --sun:#ffd27a; --violet:#9a8dff;
  --hill:#3f9d52; --hill-2:#2f8243; --stone:#6f6a5e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.84rem}
.label{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- shell ---------- */
.shell{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);display:flex;align-items:center;justify-content:space-between;padding-block:12px 8px}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.45rem;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
.icon-btn{border:var(--border-w) solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:calc(var(--r-s) + 4px);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:4px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:var(--border-w) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:var(--border-w) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:var(--border-w) solid transparent;border-radius:calc(var(--r-s) + 6px);padding:14px 18px;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 0 color-mix(in oklab,var(--accent) 60%,var(--ink))}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-danger{background:transparent;border-color:var(--alarm);color:var(--alarm)}
.btn-wide{width:100%}
.btn svg{width:22px;height:22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* ---------- scene / coach ---------- */
.hero{padding:0;overflow:hidden;gap:0}
.scene{background:var(--sky);position:relative}
.scene svg{display:block;width:100%;height:auto}
.bubble{position:relative;margin:0 14px;transform:translateY(-10px);background:var(--surface);border:var(--border-w) solid var(--line);border-radius:calc(var(--r-s) + 4px);padding:12px 14px;font-weight:600;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;top:-9px;left:calc(50% - 9px);width:16px;height:16px;background:var(--surface);border-left:var(--border-w) solid var(--line);border-top:var(--border-w) solid var(--line);transform:rotate(45deg)}
.coach-meta{display:flex;align-items:center;gap:10px;padding:2px 16px 16px}
.coach-name{font-family:var(--font-display);font-weight:600;font-size:1.05rem;white-space:nowrap}
.life{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.life i{display:block;height:100%;background:linear-gradient(90deg,var(--comb),var(--beak));border-radius:99px;transition:width .8s ease}
.hen{transform-origin:60px 110px;animation:bob 2.6s ease-in-out infinite}
.hen.happy{animation-duration:1.4s}
.hen.worried{animation:shiver 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shiver{0%,90%,100%{transform:translateX(0)}92%{transform:translateX(-1.5px)}94%{transform:translateX(1.5px)}96%{transform:translateX(-1px)}}
.flower{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- week meter ---------- */
.wk-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wk-big{font-family:var(--font-display);font-size:2.1rem;font-weight:600;line-height:1}
.wk-big small{font-size:1rem;color:var(--ink-2);font-family:var(--font-body);font-weight:700}
.track{position:relative;height:22px;border-radius:99px;background:var(--surface-2);margin:22px 0 6px;border:var(--border-w) solid var(--line)}
.track .fill{position:absolute;left:0;top:-1px;bottom:-1px;width:calc(min(var(--fill),1) * 100%);background:var(--accent);border-radius:99px;transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.track.over{border-right-color:var(--alarm)}
.track.over .fill{width:calc(var(--fill) * 100%);max-width:calc(100% + 34px);background:var(--alarm);border-radius:99px 0 0 99px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 20%,calc(100% - 8px) 42%,100% 62%,calc(100% - 9px) 82%,calc(100% - 2px) 100%,0 100%);animation:strain 1.8s ease-in-out infinite}
@keyframes strain{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.mark{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink-2);font-style:normal}
.mark span{position:absolute;top:-19px;transform:translateX(-50%);font-size:.7rem;font-weight:800;color:var(--ink-2);white-space:nowrap}
.mark.max{border-left:2px solid var(--alarm)}
.mark.max span{color:var(--alarm);transform:translateX(calc(-100% + 2px))}
.mark.goal{border-left-color:var(--calm)}
.mark.goal span{color:var(--calm)}
.wk-foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.day{background:var(--surface-2);border:var(--border-w) solid transparent;border-radius:var(--r-s);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day.today{border-color:var(--accent)}
.day .dn{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.day .col{height:34px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.day .col i{display:block;width:12px;border-radius:4px 4px 2px 2px;background:var(--accent)}
.day .col i.hi{background:var(--alarm)}
.day .col svg{width:22px;height:22px}
.day .dg{font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.catch{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;background:color-mix(in oklab,var(--violet) 12%,var(--surface));border-color:color-mix(in oklab,var(--violet) 35%,var(--line))}
.catch p{flex:1 1 180px;font-weight:700}
.catch .row{flex:1 1 220px;flex-wrap:nowrap}
.catch .row > .btn{flex:1 1 0}
.catch .btn{min-height:42px;padding:9px 12px;font-size:.92rem}
.note{display:flex;gap:12px;align-items:flex-start}
.note svg{flex:none;width:26px;height:26px;color:var(--violet)}
.note p{font-size:.92rem}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--scrim) 50%,transparent);animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:calc(var(--r) + 4px) calc(var(--r) + 4px) 0 0;border-top:var(--border-w) solid var(--line);animation:up .28s cubic-bezier(.2,1,.4,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}
.sheet-head::before{content:"";position:absolute;top:7px;left:calc(50% - 20px);width:40px;height:4px;border-radius:9px;background:var(--line)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding-block:2px 16px;min-height:0;flex:1}
.sheet-foot{padding-block:10px 14px;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:var(--border-w) solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;border:var(--border-w) solid var(--line);background:var(--surface-2);border-radius:calc(var(--r-s) + 4px);padding:0 12px}
.search svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1rem;padding:13px 0;color:var(--ink);outline:none}
.list{display:flex;flex-direction:column;gap:6px}
.food{display:flex;align-items:center;gap:12px;border:var(--border-w) solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;text-align:left;width:100%}
.food .fn{flex:1;min-width:0;font-weight:700}
.food .fi{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .plus{width:30px;height:30px;border-radius:99px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-weight:800}
.dot{width:10px;height:10px;border-radius:99px;flex:none;display:inline-block}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:8px;border:var(--border-w) solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:12px;font-weight:700;text-align:left}
.tray{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:var(--r);padding:12px}
.tray-item{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:var(--r-s);padding:10px 12px}
.tray-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.x{border:0;background:none;color:var(--ink-2);width:32px;height:32px;border-radius:99px;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.comp{display:flex;align-items:center;gap:8px}
.comp .cn{flex:1;min-width:0;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:99px;padding:3px}
.stepper button{width:34px;height:34px;border:0;border-radius:99px;background:var(--surface);font-weight:800;font-size:1.1rem}
.stepper output{min-width:66px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:.92rem}

/* ---------- onboarding ---------- */
.ob{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:22px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ob h1{font-size:clamp(2rem,9vw,2.7rem)}
.ob .lead{font-size:1.06rem;color:var(--ink-2)}
.ob-steps{display:flex;gap:6px}
.ob-steps i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.ob-art{border-radius:var(--r);overflow:hidden;background:var(--sky);border:var(--border-w) solid var(--line)}
.ob-art svg{display:block;width:100%;height:auto}
.ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;width:100%}
.choice b{font-family:var(--font-display);font-weight:600;font-size:1.25rem}
.choice span{color:var(--ink-2);font-size:.95rem}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.rim{border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--rim),#ff6b6b,#ffb938,#5cc46b,#3fb6e8,#8f80ff,#ff6bb5,#ff6b6b) border-box;animation:rim 5s linear infinite}
.rim[aria-pressed="true"]{border-color:transparent}
@keyframes rim{to{--rim:360deg}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:calc(var(--r-s) + 6px)}
.seg button{border:0;background:transparent;border-radius:calc(var(--r-s) + 3px);padding:10px 8px;font-weight:800;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.steps-list{display:flex;flex-direction:column;gap:8px;padding-left:1.2em;margin:0}

/* ---------- insights ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:var(--border-w) solid var(--line);border-radius:var(--r-s);padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-weight:600;font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;font-weight:700;color:var(--ink-2);line-height:1.25}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.runner{position:absolute;bottom:72px;left:0;width:56px;pointer-events:none;animation:run 3.6s linear forwards}
.runner svg{animation:hop .3s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(-60px)}to{transform:translateX(min(560px,110vw))}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.bars{display:flex;flex-direction:column;gap:10px}
.cmp{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center;font-weight:700;font-size:.92rem}
.cmp .bar{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:99px}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{display:flex;align-items:center;gap:8px;font-weight:600}
.kv dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.memorial{display:flex;flex-direction:column;gap:8px}
.memorial div{display:flex;align-items:center;gap:10px}
.memorial svg{width:28px;height:28px;flex:none}

/* ---------- why ---------- */
.why-head{display:flex;flex-direction:column;gap:8px;padding:6px 2px 2px}
.why-head h1{font-size:2rem}
.why-card h2{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.why-card ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:7px}
.why-card li::marker{color:var(--accent)}
.co2tag{align-self:flex-start;font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r-s);border:var(--border-w) solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700}
.links a span{font-weight:600;font-size:.84rem;color:var(--ink-2);display:block}
.links a svg{width:18px;height:18px;flex:none;color:var(--ink-2)}

/* ---------- settings ---------- */
.set-sec{display:flex;flex-direction:column;gap:10px}
.set-sec h2{font-size:1.1rem}
textarea.dump{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);padding:10px}

/* ---------- loss modal ---------- */
.loss{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--scrim) 78%,transparent);animation:fade .5s ease}
.loss-card{max-width:420px;width:100%;background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.loss-card .scene{background:var(--sky)}
.loss-body{padding:18px;display:flex;flex-direction:column;gap:12px}
.loss-body h2{font-size:1.7rem}
.feather{animation:drift 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes drift{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(10deg) translateY(4px)}}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;animation:fade .2s ease}
.install-card{flex-direction:row;align-items:center;gap:12px}
.install-card svg.ph{width:40px;height:40px;flex:none;color:var(--accent)}
.install-card .txt{flex:1;min-width:0}
.install-card .btn{min-height:42px;padding:8px 14px;font-size:.9rem}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .runner{display:none}
}
</style>

/* ------------------------------- state ------------------------------- */
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k,n) => { const d = parse(k); d.setDate(d.getDate()+n); return dkey(d); };
const today = () => dkey(new Date());
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const mondayOf = k => { const d = parse(k); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return dkey(d); };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function defaults(){
  let lang = 'en';
  try { if ((navigator.language||'').toLowerCase().startsWith('de')) lang = 'de'; } catch(e){}
  return {v:1, lang, mode:null, baseline:'avg', onboarded:false, created:today(), entries:[], confirmed:[], lostSeen:0, installDismissed:false, targetSeen:GUIDE};
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return null; const s = JSON.parse(raw); return valid(s) ? Object.assign(defaults(), s) : null; }
  catch(e){ return null; }
}
function valid(s){ return s && typeof s === 'object' && Array.isArray(s.entries) && Array.isArray(s.confirmed); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let S = load() || defaults();
const ui = {tab:'home', ob:'welcome', sheet:null, logDate:null, tray:[], query:'', justLogged:false, dayKey:null, resetArmed:false, importData:null, dump:null, ranOnce:false};
let deferredPrompt = null;

const L = () => T[S.lang] || T.en;
const numLocale = () => L().locale === 'de-AT' ? 'de-DE' : L().locale;
const fmt = n => new Intl.NumberFormat(numLocale(), {maximumFractionDigits:0}).format(Math.round(n));
const fmt1 = n => new Intl.NumberFormat(numLocale(), {maximumFractionDigits:1, minimumFractionDigits:n<10?1:0}).format(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const foodName = f => f[S.lang] || f.en;
const tracks = cat => S.mode === 'all' || CATS[cat].group !== 'other';

/* ------------------------------- calculations ------------------------------- */
const isMeat = c => CATS[c].group === 'meat';
const isFish = c => CATS[c].group === 'fish';
const isOther = c => CATS[c].group === 'other';
const isAny = () => true;
function sumRange(from, to, pred){
  let g = 0;
  for (const e of S.entries) if (e.date >= from && e.date <= to) for (const it of e.items) if (CATS[it.cat] && pred(it.cat)) g += it.g;
  return g;
}
const dayHas = (k, pred) => S.entries.some(e => e.date === k && e.items.some(it => pred(it.cat)));
const last7 = (pred=isMeat) => sumRange(addDays(today(),-6), today(), pred);
const prev7 = (pred=isMeat) => sumRange(addDays(today(),-13), addDays(today(),-7), pred);
const watched = c => S.mode === 'all' ? true : !isOther(c);

function personalTarget(){
  let t = GUIDE, w = mondayOf(S.created);
  if (w < S.created) w = addDays(w, 7);          // first full week after starting
  const cur = mondayOf(today());
  for (; w < cur; w = addDays(w, 7)) {
    if (sumRange(w, addDays(w,6), isMeat) <= t) t = Math.max(0, t - 25);
  }
  return t;
}
function pressure(){ return Math.max(0, Math.min(1, (last7() - GUIDE) / (MAXG - GUIDE))); }
function streak(){
  let n = 0, k = addDays(today(), -1);
  while (k >= S.created && !dayHas(k, watched)) { n++; k = addDays(k, -1); }
  return n;
}
function unconfirmed(){
  const out = [], start = S.created > addDays(today(),-6) ? S.created : addDays(today(),-6);
  for (let k = start; k < today(); k = addDays(k,1)) if (!S.entries.some(e => e.date === k) && !S.confirmed.includes(k)) out.push(k);
  return out;
}
const poultryTotal = () => S.entries.reduce((a,e) => a + e.items.reduce((b,it) => b + (it.cat === 'poultry' ? it.g : 0), 0), 0);
const coachName = i => NAMES[i % NAMES.length] + (i >= NAMES.length ? ' ' + (Math.floor(i / NAMES.length) + 1) : '');
function coach(){ const tot = poultryTotal(); const idx = Math.floor(tot / BIRD_G); return {idx, name:coachName(idx), life:1 - (tot % BIRD_G) / BIRD_G, left:BIRD_G - (tot % BIRD_G)}; }
function memorial(){
  const sorted = [...S.entries].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts);
  const out = []; let acc = 0, from = S.created, k = 0;
  for (const e of sorted) for (const it of e.items) if (it.cat === 'poultry') {
    acc += it.g;
    while (acc >= (k + 1) * BIRD_G) { out.push({name:coachName(k), from, to:e.date}); from = e.date; k++; }
  }
  return {gone:out, sinceCurrent:from};
}
function co2(from, to){
  const r = {meat:0, fish:0, other:0, base:0};
  for (const e of S.entries) if (e.date >= from && e.date <= to) for (const it of e.items) {
    const c = CATS[it.cat]; if (!c || c.co2 == null || !tracks(it.cat)) continue;
    r[c.group] += it.g / 1000 * c.co2;
  }
  if (S.mode !== 'all') {
    const b = BASELINES[S.baseline] || BASELINES.avg, days = daysBetween(from, to) + 1;
    r.base = (b.egg/1000*CATS.egg.co2 + b.milk/1000*CATS.milk.co2 + b.cheese/1000*CATS.cheese.co2) * days / 7;
  }
  r.total = r.meat + r.fish + r.other + r.base;
  return r;
}
function animals(){
  const r = {chicken:0, pig:0, cattle:0, sheep:0, fish:0, hen:0};
  for (const e of S.entries) for (const it of e.items) {
    const c = CATS[it.cat]; if (!c) continue;
    if (c.animal) r[c.animal] += it.g / c.perAnimal;
    if (it.cat === 'egg' && S.mode === 'all') r.hen += (it.g / 60) * 1.2;   // ≈300 eggs a year
  }
  return r;
}
function b12Flag(){
  if (daysBetween(S.created, today()) < 14) return false;
  const from = addDays(today(), -13);
  if (S.mode === 'all') return sumRange(from, today(), isAny) < 150;
  return S.baseline === 'low' && sumRange(from, today(), c => !isOther(c)) === 0;
}
function coachLine(){
  const l = L(), c = coach(), g = last7(), t = personalTarget();
  if (ui.justLogged) return {mood:'neutral', text:l.msgLogged};
  if (!S.entries.length && daysBetween(S.created, today()) < 1) return {mood:'happy', text:(S.mode==='all'?l.msgNewAll:l.msgNew)(c.name)};
  if (t < (S.targetSeen ?? GUIDE)) return {mood:'happy', text:l.msgTargetDown(t)};
  if (g > MAXG) return {mood:'worried', text:l.msgOverMax(fmt(g))};
  if (g > t) {
    const s = streak();
    if (s >= 2) return {mood:'neutral', text:l.msgStreak(s) + ' ' + l.msgOver(fmt(g), fmt(g - t))};
    return {mood:'worried', text:l.msgOver(fmt(g), fmt(g - t))};
  }
  const s = streak();
  if (g === 0 && daysBetween(S.created, today()) >= 7) return {mood:'happy', text:l.msgZero};
  if (s >= 1) return {mood:'happy', text:l.msgStreak(s)};
  const better = prev7() - g;
  if (better >= 50 && daysBetween(S.created, today()) >= 13) return {mood:'happy', text:l.msgBetter(fmt(better))};
  return {mood:'happy', text:l.msgUnder(fmt(g), fmt(t))};
}

function hillY(x){ return 300 - 168 * Math.sqrt(Math.max(0, 1 - ((x - 180) / 300) ** 2)); }
function flowerSVG(x, i, ok, delay){
  const y = hillY(x) + 2;
  if (!ok) return `<ellipse cx="${x}" cy="${y-1}" rx="7" ry="4" fill="var(--stone)"/>`;
  const col = ['var(--f1)','var(--f2)','var(--f3)','var(--f4)'][i % 4];
  const cy = y - 20, petals = [0,72,144,216,288].map(a => { const r = a*Math.PI/180; return `<circle cx="${(x+Math.cos(r)*5).toFixed(1)}" cy="${(cy+Math.sin(r)*5).toFixed(1)}" r="4.2" fill="${col}"/>`; }).join('');
  return `<g class="flower" style="animation-delay:${delay}ms"><path d="M${x} ${y}V${cy+3}" stroke="var(--hill-2)" stroke-width="2.6" stroke-linecap="round"/><path d="M${x} ${y-8}q6-6 9-2q-5 5-9 2z" fill="var(--hill-2)"/>${petals}<circle cx="${x}" cy="${cy}" r="3.2" fill="var(--sun)"/></g>`;
}

}

function dayLabel(k){

const wd = k => new Intl.DateTimeFormat(L().locale, {weekday:'narrow'}).format(parse(k));
function listDays(keys){

  const names = keys.map(k => k === addDays(today(),-1) ? l.yesterday : f.format(parse(k)));
  return names.length <= 3 ? names.join(', ') : `${names[0]} – ${names[names.length-1]}`;
}

/* ------------------------------- render: insights ------------------------------- */
function chartSVG(){
  const l = L(), W = 340, H = 236, Lp = 30, R = 6, T = 50, B = 26, pw = W - Lp - R, ph = H - T - B;
  const cur = mondayOf(today()), tgt = personalTarget();
  const weeks = Array.from({length:8}, (_,i) => { const m = addDays(cur, -7 * (7 - i)); return {m, g:sumRange(m, addDays(m,6), isMeat), current:i === 7, before:addDays(m,6) < S.created}; });
  const y = g => T + ph - Math.min(g, MAXG) / MAXG * ph, step = pw / 8, bw = step * 0.56;
  const fmtD = new Intl.DateTimeFormat(l.locale, {day:'numeric', month:'numeric'});
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${l.weeks8}">`;
  s += `<rect x="${Lp}" y="${T}" width="${pw}" height="${ph}" fill="none" stroke="var(--line)" stroke-width="1.5" rx="6"/>`;
  [[MAXG,'var(--alarm)','',l.max],[GUIDE,'var(--ink-2)','5 4',GUIDE+' g']].forEach(([v,c,d,lab]) => {
    s += `<line x1="${Lp}" x2="${Lp+pw}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.6" ${d ? `stroke-dasharray="${d}"` : ''}/>`;
    s += `<text x="${Lp-4}" y="${y(v)+4}" text-anchor="end" font-size="10" font-weight="800" fill="${c}">${v}</text>`;
  });
  if (tgt < GUIDE) s += `<line x1="${Lp}" x2="${Lp+pw}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--calm)" stroke-width="1.6" stroke-dasharray="2 4"/>${GUIDE - tgt >= 60 ? `<text x="${Lp-4}" y="${y(tgt)+4}" text-anchor="end" font-size="10" font-weight="800" fill="var(--calm)">${tgt}</text>` : ''}`;
  s += `<text x="${Lp-4}" y="${T+ph+4}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink-2)">0</text>`;
  weeks.forEach((w,i) => {
    const cx = Lp + step * (i + .5), x = cx - bw / 2, base = T + ph;
    if (!w.before && w.g > 0) {
      if (w.g > MAXG) {
        const top = Math.max(6, T - Math.min((w.g - MAXG) / MAXG * ph, T - 6));
        const zig = `${x},${top+6} ${x+bw*.25},${top} ${x+bw*.5},${top+7} ${x+bw*.75},${top+1} ${x+bw},${top+6}`;
        s += `<polygon points="${x},${base} ${zig} ${x+bw},${base}" fill="var(--alarm)" opacity="${w.current ? .55 : 1}"><animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1.6s" repeatCount="indefinite"/></polygon>`;
        s += `<text x="${cx}" y="${top-4}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--alarm)">${fmt(w.g)}</text>`;
      } else {
        const h = Math.max(3, base - y(w.g)), col = w.g > GUIDE ? 'color-mix(in oklab, var(--calm), var(--alarm) ' + Math.round((w.g-GUIDE)/(MAXG-GUIDE)*100) + '%)' : 'var(--calm)';
        s += `<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="${col}" opacity="${w.current ? .55 : 1}"/>`;
        s += `<text x="${cx}" y="${base-h-5}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink-2)">${fmt(w.g)}</text>`;
      }
    }
    if (!w.before && !w.current && w.g <= tgt) {
      const sy = (w.g > 0 ? base - Math.max(3, base - y(w.g)) : base) - (w.g > 0 ? 14 : 0);
      s += `<g transform="translate(${cx-9} ${sy-18})"><path d="M9 18v-7" stroke="var(--calm)" stroke-width="2.2" stroke-linecap="round"/><path d="M9 12c-4 0-6-3-6-6 3 0 6 2 6 6zM9 10c0-3 2-6 6-6 0 4-3 6-6 6z" fill="var(--calm)"/></g>`;
    }
    s += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink-2)">${w.current ? (S.lang==='de' ? 'jetzt' : 'now') : fmtD.format(parse(w.m))}</text>`;
  });
  return s + '</svg>';
}

}

/* ------------------------------- render: shell ------------------------------- */
function render(){
  const root = document.documentElement;
  root.lang = S.lang;
  const app = document.getElementById('app');
  if (!S.onboarded) { root.style.setProperty('--p', '0'); app.innerHTML = renderOnboarding(); return; }
  root.style.setProperty('--p', pressure().toFixed(3));
  const l = L();
  const view = ui.tab === 'insights' ? renderInsights() : ui.tab === 'why' ? renderWhy() : ui.tab === 'settings' ? renderSettings() : renderHome();
  const tab = (k, ic, lab) => `<button class="tab" data-act="tab" data-v="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic}<span>${lab}</span></button>`;
  app.innerHTML = `<div class="shell">
    <header class="top"><div class="brand">${brandSVG}Flexi</div>
      <button class="icon-btn" data-act="tab" data-v="settings" aria-label="${l.settings}" ${ui.tab==='settings'?'aria-current="page"':''}>${I.gear}</button></header>
    <main id="main">${view}</main></div>
    <nav class="tabs" aria-label="Flexi"><div class="tabs-in">${tab('home',I.home,l.navHome)}${tab('insights',I.chart,l.navInsights)}${tab('why',I.why,l.navWhy)}</div></nav>`;
  renderLayer();
}

/* ------------------------------- sheets & modal ------------------------------- */
function renderLayer(){
  const layer = document.getElementById('layer'), l = L();
  const c = coach();
  if (S.onboarded && c.idx > S.lostSeen) {
    const lost = coachName(S.lostSeen), next = coachName(S.lostSeen + 1);
    layer.innerHTML = `<div class="loss" role="dialog" aria-modal="true" aria-labelledby="lossT"><div class="loss-card">
      <div class="scene">${sceneSVG('neutral',[false,false,false,false,false,false,false],{gone:true})}</div>
      <div class="loss-body"><h2 id="lossT">${esc(l.lossTitle(lost))}</h2><p>${esc(l.lossText(lost, next))}</p>
      <button class="btn btn-primary btn-wide" data-act="lossOk">${esc(l.lossOk(next))}</button></div></div></div>`;
    return;
  }
  if (!ui.sheet) { layer.innerHTML = ''; return; }
  if (ui.sheet === 'log') {
    const dates = Array.from({length:7}, (_,i) => addDays(today(), -i)).filter(k => k >= addDays(S.created, -7));
    layer.innerHTML = `<div class="scrim" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="logT"><div class="sheet-in">
      <div class="sheet-head"><h2 id="logT" style="font-size:1.4rem">${l.logTitle}</h2><button class="x" data-act="closeSheet" aria-label="${l.close}">${I.x}</button></div>
      <div class="sheet-body">
        <div class="chips" role="group">${dates.map(k => `<button class="chip" data-act="logDate" data-v="${k}" aria-pressed="${ui.logDate===k}">${dayLabel(k)}</button>`).join('')}</div>
        <label class="search">${I.search}<input id="q" type="search" autocomplete="off" placeholder="${esc(l.searchPh)}" value="${esc(ui.query)}" aria-label="${esc(l.searchPh)}"></label>
        <div id="results">${resultsHTML()}</div>
        <div id="tray">${trayHTML()}</div>
      </div>
      <div class="sheet-foot" id="foot">${footHTML()}</div>
    </div></div>`;
  } else if (ui.sheet === 'day') {
    const k = ui.dayKey, list = S.entries.filter(e => e.date === k).sort((a,b) => a.ts - b.ts);
    layer.innerHTML = `<div class="scrim" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dayT"><div class="sheet-in">
      <div class="sheet-head"><h2 id="dayT" style="font-size:1.4rem">${dayLabel(k)}</h2><button class="x" data-act="closeSheet" aria-label="${l.close}">${I.x}</button></div>
      <div class="sheet-body">
        ${list.length ? `<div class="list">${list.map(e => `<div class="food"><span class="fn">${esc(e.label)}<span class="fi">${itemsText(e.items)}</span></span><button class="x" data-act="delEntry" data-v="${e.id}" aria-label="${l.delete}">${I.x}</button></div>`).join('')}</div>`
          : `<p class="muted">${S.mode==='all' ? l.dayEmptyAll : l.dayEmpty}</p>`}
      </div>
      <div class="sheet-foot"><button class="btn btn-primary btn-wide" data-act="log" data-v="${k}">${I.plus}${l.addForDay}</button></div>
    </div></div>`;
  }
}
function amountText(cat, g){ return cat === 'egg' ? L().eggUnit(Math.round(g / 60 * 10) / 10) : `${fmt(g)} ${CATS[cat].unit === 'ml' ? 'ml' : 'g'}`; }
function itemsText(items){ return items.map(it => `${L().catShort[it.cat]} ${amountText(it.cat, it.g)}`).join(' · '); }
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss'); }
function visibleFoods(){ return FOODS.filter(f => f.items.some(([c]) => tracks(c))); }
function foodBtn(f){
  const items = f.items.filter(([c]) => tracks(c)).map(([cat,g]) => ({cat,g}));
  return `<button class="food" data-act="addFood" data-v="${f.id}"><span class="dot" style="background:var(--c-${items[0].cat})"></span><span class="fn">${esc(foodName(f))}<span class="fi">${itemsText(items)}</span></span><span class="plus" aria-hidden="true">+</span></button>`;
}
function resultsHTML(){
  const l = L(), q = norm(ui.query.trim());
  if (q) {
    const hits = visibleFoods().filter(f => norm(f.en).includes(q) || norm(f.de).includes(q));
    const catHits = CAT_ORDER.filter(c => tracks(c) && (norm(T.en.cat[c]).includes(q) || norm(T.de.cat[c]).includes(q)));
    if (!hits.length && !catHits.length) return `<p class="muted small">${l.noResults}</p>${catsHTML()}`;
    return `<div class="list">${hits.slice(0,12).map(foodBtn).join('')}${catHits.map(c => catFoodBtn(c)).join('')}</div>`;
  }
  const seen = new Set(), recent = [];
  for (const e of [...S.entries].sort((a,b) => b.ts - a.ts)) { if (e.foodId && !seen.has(e.foodId)) { const f = FOODS.find(x => x.id === e.foodId); if (f && f.items.some(([c]) => tracks(c))) { seen.add(e.foodId); recent.push(f); } } if (recent.length >= 4) break; }
  const commonIds = S.mode === 'all' ? ['coffee','cheesesandwich','burger','schnitzelpork','pizzamarg','hamsandwich','eggs2','yogurt'] : ['burger','schnitzelpork','hamsandwich','chickenbreast','leberkaese','pizzasalami','doner','fishfillet'];
  const common = commonIds.map(id => FOODS.find(f => f.id === id)).filter(f => f && !seen.has(f.id));
  return `${recent.length ? `<span class="label">${l.recent}</span><div class="list">${recent.map(foodBtn).join('')}</div>` : ''}
    <span class="label" style="display:block;margin-top:${recent.length ? 12 : 0}px">${l.common}</span><div class="list">${common.slice(0, recent.length ? 4 : 6).map(foodBtn).join('')}</div>
    <span class="label" style="display:block;margin-top:12px">${l.orCat}</span>${catsHTML()}`;
}
function catFoodBtn(c){ return `<button class="food" data-act="addCat" data-v="${c}"><span class="dot" style="background:var(--c-${c})"></span><span class="fn">${L().cat[c]}<span class="fi">${amountText(c, CATS[c].def)}</span></span><span class="plus" aria-hidden="true">+</span></button>`; }
function catsHTML(){ return `<div class="cats" style="margin-top:6px">${CAT_ORDER.filter(tracks).map(c => `<button class="cat" data-act="addCat" data-v="${c}"><span class="dot" style="background:var(--c-${c})"></span>${L().catShort[c]}</button>`).join('')}</div>`; }
function trayHTML(){
  if (!ui.tray.length) return '';
  const l = L();
  return `<div class="tray"><span class="label">${l.adding} · ${dayLabel(ui.logDate)}</span>${ui.tray.map((t,i) => `<div class="tray-item">
    <div class="tray-top"><span>${esc(t.label)}</span><button class="x" data-act="trayDel" data-i="${i}" aria-label="${l.delete}">${I.x}</button></div>
    ${t.items.map((it,j) => `<div class="comp"><span class="cn"><span class="dot" style="background:var(--c-${it.cat})"></span>${l.catShort[it.cat]}</span>
      <span class="stepper"><button data-act="step" data-i="${i}" data-j="${j}" data-v="-1" aria-label="−">−</button><output>${amountText(it.cat, it.g)}</output><button data-act="step" data-i="${i}" data-j="${j}" data-v="1" aria-label="+">+</button></span></div>`).join('')}
  </div>`).join('')}</div>`;
}
function footHTML(){
  const l = L(), n = ui.tray.length;
  return `<button class="btn btn-primary btn-wide" data-act="saveTray" ${n ? '' : 'disabled style="opacity:.5"'}>${n ? l.saveN(n) : l.pickFirst}</button>`;
}
function refreshSheetParts(){ const r = document.getElementById('results'), t = document.getElementById('tray'), f = document.getElementById('foot'); if (r) r.innerHTML = resultsHTML(); if (t) t.innerHTML = trayHTML(); if (f) f.innerHTML = footHTML(); }

/* ------------------------------- actions ------------------------------- */
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}
function openLog(date){ ui.sheet = 'log'; ui.logDate = date || today(); ui.tray = []; ui.query = ''; renderLayer(); }
function shareApp(){
  const l = L(), url = location.href.split('#')[0];
  const data = {title:'Flexi', text:l.shareText, url};
  try { if (navigator.share) { navigator.share(data).catch(() => {}); return; } } catch(e){}
  copyText(url).then(ok => toast(ok ? l.copied : url));
}
function copyText(text){
  try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch(e){ return Promise.resolve(false); }
}
const ACT = {
  lang(v){ S.lang = v; save(); render(); },
  ob(v){ ui.ob = v; render(); window.scrollTo(0,0); },
  mode(v){ S.mode = v; save(); ui.ob = v === 'meat' ? 'base' : 'coach'; render(); },
  base(v){ S.baseline = v; save(); ui.ob = 'coach'; render(); },
  finish(){ S.onboarded = true; S.created = today(); S.targetSeen = GUIDE; save(); ui.tab = 'home'; render(); },
  async install(){ if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; render(); },
  dismissInstall(){ S.installDismissed = true; save(); render(); },
  tab(v){ ui.tab = v; ui.justLogged = false; ui.resetArmed = false; render(); window.scrollTo(0,0); },
  log(v){ openLog(v); },
  logDate(v){ ui.logDate = v; renderLayer(); },
  day(v){ ui.sheet = 'day'; ui.dayKey = v; renderLayer(); },
  closeSheet(){ ui.sheet = null; renderLayer(); },
  confirm(){ S.confirmed = [...new Set([...S.confirmed, ...unconfirmed()])].filter(k => k >= addDays(today(), -30)); save(); render(); },
  addFood(v){ const f = FOODS.find(x => x.id === v); if (!f) return; ui.tray.push({label:foodName(f), foodId:f.id, items:f.items.filter(([c]) => tracks(c)).map(([cat,g]) => ({cat,g}))}); ui.query = ''; const q = document.getElementById('q'); if (q) q.value = ''; refreshSheetParts(); },
  addCat(v){ ui.tray.push({label:L().cat[v], foodId:null, items:[{cat:v, g:CATS[v].def}]}); ui.query = ''; const q = document.getElementById('q'); if (q) q.value = ''; refreshSheetParts(); },
  trayDel(_, el){ ui.tray.splice(+el.dataset.i, 1); refreshSheetParts(); },
  step(v, el){ const it = ui.tray[+el.dataset.i].items[+el.dataset.j], st = CATS[it.cat].step; it.g = Math.max(st, Math.min(2000, Math.round((it.g + st * +v) / st) * st)); refreshSheetParts(); },
  saveTray(){
    if (!ui.tray.length) return;
    const ts = Date.now();
    ui.tray.forEach((t,i) => { const items = t.items.filter(it => it.g > 0); if (items.length) S.entries.push({id:uid(), date:ui.logDate, ts:ts + i, label:t.label, foodId:t.foodId, items}); });
    save(); ui.sheet = null; ui.tray = []; ui.justLogged = true; ui.tab = 'home'; render(); toast(L().saved);
    setTimeout(() => { if (ui.justLogged) { ui.justLogged = false; if (ui.tab === 'home' && !ui.sheet) render(); } }, 6000);
  },
  delEntry(v){ S.entries = S.entries.filter(e => e.id !== v); if (S.lostSeen > coach().idx) S.lostSeen = coach().idx; save(); render(); toast(L().removed); },
  lossOk(){ S.lostSeen++; save(); render(); },
  setmode(v){ S.mode = v; save(); render(); },
  setbase(v){ S.baseline = v; save(); render(); },
  share(){ shareApp(); },
  export(){
    const json = JSON.stringify(S, null, 1);
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type:'application/json'})); a.download = `flexi-backup-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } catch(e){}
    ui.dump = json; render();
  },
  copydata(){ const json = JSON.stringify(S); copyText(json).then(ok => { if (ok) toast(L().dataCopied); else { ui.dump = json; render(); toast(L().copyFail); } }); },
  importOk(){ const d = ui.importData; ui.importData = null; S = Object.assign(defaults(), d, {onboarded:true}); save(); render(); toast(L().imported); },
  importCancel(){ ui.importData = null; render(); },
  reset(){
    if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(() => { if (ui.resetArmed) { ui.resetArmed = false; if (ui.tab === 'settings') render(); } }, 4000); return; }
    try { localStorage.removeItem(KEY); } catch(e){}
    S = defaults(); ui.resetArmed = false; ui.ob = 'welcome'; ui.tab = 'home'; render(); toast(L().resetDone);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.v, el); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { ui.query = e.target.value; const r = document.getElementById('results'); if (r) r.innerHTML = resultsHTML(); } });
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { try { const d = JSON.parse(fr.result); if (!valid(d)) throw 0; ui.importData = d; } catch(err){ toast(L().importBad); } render(); };
  fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) ACT.closeSheet(); });

/* targetSeen: remember the current target once the "new target" message was shown */
const _coachLine = coachLine;
coachLine = function(){ const r = _coachLine(); const t = personalTarget(); if (t < (S.targetSeen ?? GUIDE) && r.text === L().msgTargetDown(t)) { setTimeout(() => { S.targetSeen = t; save(); }, 0); } return r; };

/* ------------------------------- PWA ------------------------------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; render(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; render(); });
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); ui.justLogged = false; render(); } });

render();
</script>
